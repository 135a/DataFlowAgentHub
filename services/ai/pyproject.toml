[project]
name = "hub-ai"
version = "0.2.0"
description = "Multi-Agent AI worker for DataFlowAgentHub (NL2SQL + LangGraph + RAG)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # gRPC core
  "grpcio==1.68.1",
  "grpcio-tools==1.68.1",
  "protobuf==5.28.3",
  # LLM
  "openai==1.57.4",
  # Multi-Agent orchestration
  "langgraph>=0.2.0",
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  # Vector / RAG
  "chromadb>=0.5.0",
  # Data analysis
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  # Report export
  "openpyxl>=3.1.0",
  # Async task consumer (NATS)
  "nats-py>=2.7.0",
  # HTTP callbacks to Go control plane
  "httpx>=0.27.0",
  # Observability
  "opentelemetry-sdk>=1.25.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
