---
apiVersion: v1
kind: Service
metadata:
  name: hub-ai-worker
  labels:
    app: hub-ai-worker
spec:
  type: ClusterIP
  ports:
    - port: 50051
      targetPort: 50051
      protocol: TCP
      name: grpc
  selector:
    app: hub-ai-worker

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub-ai-worker
  labels:
    app: hub-ai-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hub-ai-worker
  template:
    metadata:
      labels:
        app: hub-ai-worker
    spec:
      containers:
        - name: ai-worker
          image: hub-ai-worker:latest
          ports:
            - containerPort: 50051
              protocol: TCP
          envFrom:
            - configMapRef:
                name: hub-config
            - secretRef:
                name: hub-secret
          livenessProbe:
            exec:
              command:
                - grpc_health_probe
                - -addr=localhost:50051
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
